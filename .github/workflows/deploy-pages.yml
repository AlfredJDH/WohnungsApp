name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die der Workflow braucht, um Pages zu aktivieren und zu deployen
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deploy gleichzeitig; laufende nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pages einrichten (aktiviert Pages, falls noch aus)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite als Artefakt hochladen (gesamtes Repo-Root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
